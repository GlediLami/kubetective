# goreleaser configuration (roadmap v0.9): linux/darwin binaries, deb/rpm
# packages, container image, checksums, SBOM. Release flow:
#
#   make release VERSION=v0.9.0        # bump, tag, push, formula, tap (CONTRIBUTING.md)
#   goreleaser release --clean         # publish binaries/containers from the tag
#
# Signing is KEYLESS (sigstore): the release workflow's GitHub OIDC token is
# exchanged with Fulcio for a short-lived certificate, and the signature is
# logged in Rekor. There is no private key to store, rotate, or leak - which
# is why the previous key-based config never ran: it required COSIGN_PRIVATE_KEY
# and COSIGN_PASSWORD secrets that were never created.
#
# Verify a release without trusting us: see SECURITY.md.
version: 2

project_name: kubetective

before:
  hooks:
    - go mod tidy

builds:
  - id: kubetective
    main: ./cmd/kubetective
    binary: kubetective
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w
      - -X github.com/GlediLami/kubetective/internal/engine.Version={{ .Version }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]
  - id: kubectl-investigate
    main: ./cmd/kubectl-investigate
    binary: kubectl-investigate
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w
      - -X github.com/GlediLami/kubetective/internal/engine.Version={{ .Version }}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - id: default
    formats: [tar.gz]
    files: [README.md, LICENSE]

nfpms:
  - id: kubetective
    package_name: kubetective
    vendor: GlediLami
    homepage: https://github.com/GlediLami/kubetective
    description: Kubernetes incident investigation engine
    license: Apache-2.0
    maintainer: Gledi Lami <gledi.lami@example.com>
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/kubetective/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/kubetective/NOTICE
      - src: README.md
        dst: /usr/share/doc/kubetective/README.md

sboms:
  - id: archive
    artifacts: archive

# NOTE: goreleaser is phasing `dockers` out in favour of `dockers_v2`
# (https://goreleaser.com/deprecations#dockers). Not migrated yet - the change
# also moves image signing, and it cannot be verified without a real registry
# push. Migrate at the next release, with a dry run against a scratch repo.
dockers:
  - id: kubetective
    use: buildx
    goos: linux
    goarch: amd64
    # goreleaser's build context is the binaries it just built plus extra_files
    # - not the source tree - so this cannot be the top-level Dockerfile.
    dockerfile: Dockerfile.release
    extra_files:
      - LICENSE
      - NOTICE
    image_templates:
      - "ghcr.io/gledilami/kubetective:{{ .Version }}"
      - "ghcr.io/gledilami/kubetective:latest"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source=https://github.com/GlediLami/kubetective"
      - "--label=org.opencontainers.image.licenses=Apache-2.0"

# Sign the checksum manifest rather than every artifact: checksums.txt covers
# each file by digest, so one signature transitively covers the whole release
# and verification stays a two-step check anyone can run.
signs:
  - id: keyless
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - "sign-blob"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

# The container image is signed by digest and carries its SBOM as an
# attestation, so `cosign verify` and `cosign verify-attestation` both work
# against ghcr.io without downloading anything first.
docker_signs:
  - id: keyless-image
    cmd: cosign
    args: ["sign", "${artifact}", "--yes"]
    artifacts: all
    output: true

release:
  github:
    owner: GlediLami
    name: kubetective
  header: |
    ## kubetective {{ .Version }}

    Keyless-signed with cosign (sigstore); SBOMs attached to the archives and
    attested on the container image. Verification instructions:
    [SECURITY.md](https://github.com/GlediLami/kubetective/blob/main/SECURITY.md#verifying-a-release).
    See the [CHANGELOG](CHANGELOG.md) for what shipped.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
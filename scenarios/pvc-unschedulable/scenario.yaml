name: pvc-unschedulable
description: >-
  The pod stays Pending because its 100Gi claim cannot bind: no PV available
  and no storage class. The PVC root cause must outrank the generic
  scheduling hypothesis.
ground_truth:
  root_cause: "PersistentVolumeClaim cannot bind (no PV, no storage class)"
  top_hypothesis_category: pvc
  min_score: 0.85
  expected_finding_analyzers:
    - pvc
    - scheduling
  expected_status: PVCUNBOUND
mutations:
  - name: without-the-claim
    reason: >-
      The unbound PVC is what makes this a storage problem rather than generic
      unschedulability; the verdict must degrade to scheduling, not stay pvc.
    remove_kinds: [pvc.state]
    expect_category: scheduling

name: dns-failure
description: >-
  coreDNS is scaled but has 0 available replicas; the workload's pods cannot
  create sandboxes (FailedToCreatePodSandBox, 'no such host') and crash-loop.
  The DNS hypothesis must beat the plain crashloop explanation.
ground_truth:
  root_cause: "coreDNS down — pods cannot resolve names and crash-loop"
  top_hypothesis_category: dns
  min_score: 0.8
  expected_finding_analyzers:
    - dns
    - crashloop
  expected_status: CRASHLOOPBACKOFF
mutations:
  - name: without-coredns-state
    reason: >-
      coreDNS sitting at zero available replicas is the only thing separating a
      DNS outage from an ordinary crash loop. Without it the engine must not
      claim DNS.
    remove_kinds: [deployment.state]
    expect_category: crashloop
  - name: without-sandbox-events
    reason: >-
      The FailedToCreatePodSandBox / 'no such host' events carry the resolution
      failure itself.
    remove_kinds: [event.recorded]
    expect_category: crashloop

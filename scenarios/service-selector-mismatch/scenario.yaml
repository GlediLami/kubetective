name: service-selector-mismatch
description: >-
  Two healthy checkout pods run, but the service has zero endpoints: its
  selector does not match the pods' labels. Every request 503s.
ground_truth:
  root_cause: "Service selector does not match the running pods"
  top_hypothesis_category: service
  min_score: 0.85
  expected_finding_analyzers:
    - service
  expected_status: NOENDPOINTS
mutations:
  - name: without-the-service
    reason: >-
      The selector mismatch is the entire finding. With no service observed the
      two pods are simply healthy, and the engine must fall silent rather than
      invent a cause.
    remove_kinds: [service.state]
    expect_no_findings: true

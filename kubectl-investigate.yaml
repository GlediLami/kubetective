apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: investigate
spec:
  version: "v1.0.0"
  homepage: https://github.com/GlediLami/kubetective
  shortDescription: Investigate Kubernetes incidents (evidence-first, LLM-assisted)
  description: |
    Investigate a Kubernetes incident with evidence-first reasoning. KubeTective
    collects deterministic evidence (pod state, events, logs, deployment owner
    graph, HPA pressure, PVC, service/endpoint, gitops CRs), scores candidate
    root causes against evidence, and only then consults an LLM for narrative -
    never for scoring. Includes `kubetective doctor`, a kubetective.yaml config
    file, an incident memory store with multi-cluster scoping, and human-gated
    rollback/restart actions.
  platforms:
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/GlediLami/kubetective/releases/download/v1.0.0/kubectl-investigate_1.0.0_linux_amd64.tar.gz
      sha256: REPLACE_ME
      bin: kubectl-investigate
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/GlediLami/kubetective/releases/download/v1.0.0/kubectl-investigate_1.0.0_linux_arm64.tar.gz
      sha256: REPLACE_ME
      bin: kubectl-investigate
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/GlediLami/kubetective/releases/download/v1.0.0/kubectl-investigate_1.0.0_darwin_amd64.tar.gz
      sha256: REPLACE_ME
      bin: kubectl-investigate
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/GlediLami/kubetective/releases/download/v1.0.0/kubectl-investigate_1.0.0_darwin_arm64.tar.gz
      sha256: REPLACE_ME
      bin: kubectl-investigate